<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swarm Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32'%3E%3Cstop offset='0' stop-color='%2300d4aa'/%3E%3Cstop offset='1' stop-color='%230066ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Cpath d='M8 16L14 22L24 10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <header>
    <h1>Swarm</h1>
    <div id="stats">
      <span class="stat">
        <span class="stat-label">Tokens</span>
        <span id="stat-tokens">0</span>
      </span>
      <span class="stat">
        <span class="stat-label">TPS</span>
        <span id="stat-tps">0</span>
      </span>
      <span class="stat">
        <span class="stat-label">Active</span>
        <span id="stat-active">0</span>
      </span>
      <span class="stat">
        <span class="stat-label">Done</span>
        <span id="stat-done">0</span>
      </span>
      <span class="stat">
        <span class="stat-label">Failed</span>
        <span id="stat-failed">0</span>
      </span>
      <span id="conn-status" class="conn conn-down">Disconnected</span>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <ul id="runs-list"></ul>
    </aside>

    <main id="main">
      <h2 id="run-title">Select a run</h2>
      <div id="run-meta"></div>
      <div id="task-grid">
        <p class="empty-state">No run selected</p>
      </div>
    </main>

    <section id="feed">
      <h3>Event Feed</h3>
      <ul id="event-feed"></ul>
    </section>
  </div>

  <dialog id="task-detail">
    <h3 id="detail-title"></h3>
    <nav id="detail-tabs">
      <button data-tab="live">Output</button>
      <button data-tab="files">Files</button>
      <button data-tab="review">Review</button>
      <button data-tab="attempts">Attempts</button>
    </nav>
    <div id="detail-body"></div>
    <button id="detail-close">Close</button>
  </dialog>

  <script src="/static/app.js" defer></script>
</body>
</html>
